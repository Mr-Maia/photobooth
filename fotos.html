<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe1">
  <meta name="robots" content="noindex">
  <title>As vossas fotos · Carolina &amp; Miguel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Limelight&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="convidado">
  <main>
    <div class="letreiro pequeno" data-lampadas><span class="letreiro-txt">Photobooth</span></div>
    <h1 class="nomes" data-nomes>Carolina &amp; Miguel</h1>
    <div class="ornamento"><span></span><i>♥</i><span></span></div>
    <p class="lead">Obrigado por celebrarem connosco!</p>

    <div id="espera" class="espera">
      <div class="tira-fantasma"><i></i><i></i><i></i><i></i></div>
      <p id="espera-txt">As fotos estão a caminho…</p>
    </div>

    <div id="conteudo" hidden>
      <img id="tira" class="tira-g" alt="Tira de fotos">
      <div class="acoes">
        <button id="guardar-tira" class="btn">Guardar a tira</button>
        <button id="guardar-todas" class="btn sec">Guardar as 4 fotos</button>
      </div>
      <p class="dica">Dica: também podes manter o dedo em cima de uma foto e escolher “Guardar”.</p>
      <h3>As fotos</h3>
      <div id="grelha" class="grelha"></div>
    </div>

    <p class="rodape" data-data></p>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/fotos.js"></script>
</body>
</html>
