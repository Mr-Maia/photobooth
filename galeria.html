<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe1">
  <meta name="robots" content="noindex">
  <title>Galeria · Carolina &amp; Miguel</title>
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="convidado galeria">
  <header class="g-topo">
    <div>
      <h1 class="nomes" data-nomes>Carolina &amp; Miguel</h1>
      <p class="pre">Galeria do photobooth</p>
    </div>
    <button id="sair" class="ligacao" hidden>Sair</button>
  </header>

  <!-- Login -->
  <section id="login" class="g-cartao" hidden>
    <div class="ornamento"><span></span><i>♥</i><span></span></div>
    <p>Esta galeria é só para os noivos.</p>
    <button id="entrar" class="btn">Entrar com Google</button>
    <p id="login-erro" class="g-erro" hidden></p>
  </section>

  <!-- Galeria -->
  <section id="galeria" hidden>
    <div class="g-barra">
      <p id="resumo" class="g-resumo">A carregar…</p>
      <div class="g-acoes">
        <button id="tudo-pasta" class="btn" hidden>Guardar tudo numa pasta</button>
        <button id="tudo-zip" class="btn">Descarregar tudo (ZIP)</button>
        <button id="tiras-zip" class="btn sec">Só as tiras (ZIP)</button>
      </div>
      <div id="progresso" class="g-progresso" hidden><div><i></i></div><span></span></div>
    </div>
    <div id="sessoes" class="g-grelha"></div>
  </section>

  <!-- Detalhe de uma sessão -->
  <dialog id="detalhe" class="g-detalhe">
    <button class="fechar" aria-label="Fechar">×</button>
    <div class="g-detalhe-corpo">
      <img id="d-tira" class="g-d-tira" alt="Tira">
      <div>
        <p id="d-hora" class="g-d-hora"></p>
        <div id="d-fotos" class="grelha"></div>
        <button id="d-descarregar" class="btn">Descarregar esta sessão</button>
      </div>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script type="module" src="js/galeria.js"></script>
</body>
</html>
