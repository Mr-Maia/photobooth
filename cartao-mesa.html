<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cartões de mesa · Câmara descartável</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root { --kraft: #c2a477; --papel: #ece3cf; --tinta: #1b1a18; --turq: #3f7f7b; --latao: #a8843f; --rosa: #a8455a; --fita: #e6d9b2;
      --maquina: "Special Elite", "Courier New", monospace; --mono: "IBM Plex Mono", monospace; --marcador: "Permanent Marker", cursive; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ccc; font-family: var(--maquina); color: var(--tinta); }
    .barra { padding: 16px; text-align: center; font: 15px system-ui, sans-serif; }
    .barra button { font: 600 15px system-ui; padding: 10px 22px; border: 0; background: var(--tinta); color: #fff; cursor: pointer; }
    .folha {
      width: 210mm; height: 297mm; margin: 0 auto 20px; background: #fff;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    }
    .cartao {
      position: relative; margin: 6mm; padding: 0 7mm 6mm;
      background: var(--kraft);
      display: flex; flex-direction: column;
      border: .3mm solid rgba(0,0,0,.25);
    }
    .topo {
      margin: 0 -7mm; padding: 3mm 7mm;
      display: flex; justify-content: space-between; align-items: center;
      background: var(--tinta); color: var(--papel);
      font: 600 2.9mm var(--mono); letter-spacing: .3em; text-transform: uppercase;
      border-bottom: 1.2mm solid var(--turq);
      box-shadow: 0 1.2mm 0 var(--latao), 0 2.4mm 0 var(--rosa);
    }
    .topo b { font-weight: 600; border: .3mm solid var(--papel); padding: .3mm 1.5mm; letter-spacing: .1em; }
    .nomes { margin: 7mm 0 1mm; font: 400 7mm/1.05 var(--maquina); text-transform: uppercase; }
    .sub { margin: 0 0 4mm; font: 400 2.8mm var(--mono); letter-spacing: .2em; text-transform: uppercase; opacity: .75; }
    .meio { display: flex; flex-direction: column; align-items: center; gap: 5mm; }
    .qr { flex: none; width: 52mm; height: 52mm; padding: 2.5mm; background: var(--papel); }
    .qr svg { width: 100%; height: 100%; display: block; }
    ol { align-self: stretch; margin: 0; padding: 0; list-style: none; counter-reset: p; font-size: 3.6mm; line-height: 1.35; }
    ol li { counter-increment: p; margin-bottom: 1.6mm; }
    ol li::before { content: "0" counter(p) "  "; font: 600 2.8mm var(--mono); color: var(--rosa); }
    .fita {
      margin-top: auto; align-self: flex-start; transform: rotate(-2deg);
      padding: 1.5mm 5mm 1mm; background: var(--fita);
      font: 400 4mm var(--marcador); white-space: nowrap;
      clip-path: polygon(0 6%, 4% 0, 9% 7%, 14% 1%, 20% 6%, 100% 0, 97% 30%, 100% 55%, 96% 78%, 100% 100%, 0 100%, 3% 70%, 0 45%, 4% 22%);
    }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: none; }
      .barra { display: none; }
      .folha { margin: 0; break-after: page; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="barra">
    <p>4 cartões por folha A4. Imprime em papel grosso, recorta e põe um em cada mesa.</p>
    <label>Folhas: <input id="folhas" type="number" min="1" max="20" value="3" style="width:60px"></label>
    <button onclick="window.print()">Imprimir</button>
  </div>
  <div id="pre"><div id="folhas-area"></div></div>

  <template id="tpl">
    <div class="cartao">
      <div class="topo"><span>Câmara descartável</span><b>400</b></div>
      <p class="nomes"></p>
      <p class="sub"><span class="n"></span> exp. / flash / cor</p>
      <div class="meio">
        <div class="qr"></div>
        <ol>
          <li>Lê o código com o telemóvel.</li>
          <li>Tens <span class="n"></span> fotografias. Sem apagar, sem espreitar.</li>
          <li>Apanha o que mais ninguém apanha.</li>
        </ol>
      </div>
      <p class="fita"></p>
    </div>
  </template>

  <script src="js/config.js?v=9"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script>
    const cfg = window.PHOTOBOOTH_CONFIG;
    const qr = qrcode(0, 'M');
    qr.addData(`${cfg.siteUrl}/descartavel.html`);
    qr.make();
    const svg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    const quando = new Date(cfg.descartavel.revelacao)
      .toLocaleString('pt-PT', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).replace(',', ' às');

    function desenhar(n) {
      const area = document.getElementById('folhas-area');
      area.replaceChildren();
      for (let f = 0; f < n; f++) {
        const folha = document.createElement('div');
        folha.className = 'folha';
        for (let c = 0; c < 4; c++) {
          const el = document.getElementById('tpl').content.cloneNode(true);
          el.querySelector('.nomes').textContent = cfg.nomes;
          el.querySelector('.qr').innerHTML = svg;
          el.querySelectorAll('.n').forEach((n) => (n.textContent = cfg.descartavel.fotos));
          el.querySelector('.fita').textContent = `revelação: ${quando}`;
          folha.append(el);
        }
        area.append(folha);
      }
    }
    const inp = document.getElementById('folhas');
    inp.addEventListener('input', () => desenhar(Math.max(1, Math.min(20, +inp.value || 1))));
    desenhar(+inp.value);

    // No telemóvel: encolher a pré-visualização da folha A4 para caber no ecrã (não afeta a impressão)
    const pre = document.getElementById('pre'), area = document.getElementById('folhas-area');
    function ajustar() {
      const k = Math.min(1, (innerWidth - 16) / 794);
      if (k < 1) {
        Object.assign(area.style, { width: '794px', transform: `scale(${k})`, transformOrigin: '0 0' });
        Object.assign(pre.style, { height: `${area.offsetHeight * k}px`, overflow: 'hidden', marginLeft: '8px' });
      } else {
        area.removeAttribute('style'); pre.removeAttribute('style');
      }
    }
    addEventListener('resize', ajustar);
    addEventListener('beforeprint', () => { area.removeAttribute('style'); pre.removeAttribute('style'); });
    addEventListener('afterprint', ajustar);
    inp.addEventListener('input', ajustar);
    ajustar();
  </script>
</body>
</html>
